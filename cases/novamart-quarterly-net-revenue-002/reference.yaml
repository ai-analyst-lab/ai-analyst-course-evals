accepted_final_answer:
  required_conclusion:
    - December had the highest Q4 net revenue.
    - Net revenue increased from October to December 2024.
    - The calculation subtracts returned-order settlement value from completed-order settlement value.
  required_recommendation:
    - Investigate the contributors to completed-order value and returned-order value separately before acting on the increase.
  acceptable_semantic_variation: true
  prohibited_claims:
    - Completed-order value alone is NovaMart net revenue.
    - Cancelled orders should be subtracted as returns.
    - discount_amount should be subtracted from total_amount again.
    - This descriptive result proves why net revenue changed.

