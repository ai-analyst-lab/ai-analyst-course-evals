policy: 'Fictional NovaMart classroom policy, explicitly selected by the user-authorized
  instructor experiment on 2026-09-29, not inferred from warehouse data and not human
  production approval. Promotion-attributed order value is completed-order merchandise
  amount after the order discount, excluding shipping: SUBTOTAL minus DISCOUNT_AMOUNT.
  Only orders with non-null PROMO_ID are attributed. Attribution means the order carries
  that promotion identifier, not causal incremental lift. The reporting interval uses
  ORDER_DATE and does not require a second promotion schedule filter. Exclude cancelled/returned
  orders. Sum at order grain, then round the final monetary total to two decimals.
  The current question groups by DEVICE. This question groups the unchanged order-grain
  amount by calendar ORDER_DATE month across Q4 2024. Empty qualifying groups are
  absent, not fabricated as zero.'
