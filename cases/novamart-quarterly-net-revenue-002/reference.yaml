  approved_definition: >-
    Net revenue is settlement value from completed orders minus settlement
    value from returned orders. Cancelled orders are excluded.
  rejected_definitions:
    - Completed-order value without subtracting returned orders.
    - total_amount minus discount_amount because total_amount is already after discounts.
    - Completed, returned, and cancelled order value combined.

