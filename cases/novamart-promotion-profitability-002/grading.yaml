schema_version: "1"
case_id: novamart-promotion-profitability-002
case_version: "1"

artifact_contract:
  required_files: [result.json, promotion-results.csv, brief.md, chart.png, chart-data.csv, calculation.sql]
  exact_file_set: true
  result_json:
    path: result.json
    case_id: novamart-promotion-profitability-002
    required_sections: [case_id, promotion_results, final_answer, methodology, artifacts]
  csv:
    - id: promotion_results
      path: promotion-results.csv
      columns: [promo_name, start_date, end_date, promo_days, completed_order_count, discounted_merchandise_value, merchandise_cost, merchandise_gross_profit, gross_profit_per_day]
      min_rows: 2
      max_rows: 2
    - id: chart_data
      path: chart-data.csv
      columns: [promo_name, merchandise_gross_profit, gross_profit_per_day]
      min_rows: 2
      max_rows: 2
  image: {path: chart.png, min_width: 400, min_height: 250}
  text: {path: brief.md, min_characters: 100}

query_outputs:
  - output_id: promotion_results
    submission_sql: calculation.sql
    reference_sql: reference.sql
    submitted_table: promotion-results.csv
    allowed_sources:
      - BOOTCAMP_DB.NOVAMART.ORDERS
      - BOOTCAMP_DB.NOVAMART.ORDER_ITEMS
      - BOOTCAMP_DB.NOVAMART.PRODUCTS
      - BOOTCAMP_DB.NOVAMART.PROMOTIONS
    timeout_seconds: 60
    max_rows: 100
    diagnostic_rules:
      status_filter: {all_of: ["COMPLETED"]}
      date_boundary: {all_of: ["BLACK FRIDAY", "HOLIDAY SALE"]}
      calculation_method: {all_of: ["COUNT", "DISTINCT", "LINE_TOTAL", "COST", "DATEDIFF"]}
    comparison:
      mode: keyed_table
      keys: [promo_name]
      columns:
        promo_name: {type: string}
        start_date: {type: date}
        end_date: {type: date}
        promo_days: {type: integer}
        completed_order_count: {type: integer}
        discounted_merchandise_value: {type: decimal, absolute_tolerance: 0.01}
        merchandise_cost: {type: decimal, absolute_tolerance: 0.01}
        merchandise_gross_profit: {type: decimal, absolute_tolerance: 0.01}
        gross_profit_per_day: {type: decimal, absolute_tolerance: 0.01}

cross_artifact_tables:
  - id: result_json_matches_promotion_results
    left: {type: csv, path: promotion-results.csv}
    right: {type: json_table, path: result.json, field: promotion_results}
    comparison:
      mode: keyed_table
      keys: [promo_name]
      columns:
        promo_name: {type: string}
        start_date: {type: date}
        end_date: {type: date}
        promo_days: {type: integer}
        completed_order_count: {type: integer}
        discounted_merchandise_value: {type: decimal, absolute_tolerance: 0.01}
        merchandise_cost: {type: decimal, absolute_tolerance: 0.01}
        merchandise_gross_profit: {type: decimal, absolute_tolerance: 0.01}
        gross_profit_per_day: {type: decimal, absolute_tolerance: 0.01}

model_graders:
  - id: final_answer.v1
    rubric: course_evals/graders/model/final_answer/v1/rubric.md
    evidence: {result_json_field: final_answer, brief: brief.md}
    criteria_reference_field: accepted_final_answer
    blocking: true

diagnostics: [source_selection, date_boundary, status_filter, query_correctness, calculation_method, validation_checks, query_to_finding_linkage, trace_completeness]

headline:
  required: [artifact_contract, sql_result, cross_artifact_consistency, final_answer.v1]
