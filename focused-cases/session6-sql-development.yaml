  - case_id: novamart-q4-electronics-gross-profit-008
    case_version: "1"
    status: proposed
    exposure: working
    purpose: regression
    task: >-
      Using the configured NovaMart Snowflake data, return completed-order
      merchandise gross profit for products whose CATEGORY is exactly electronics
      and orders whose ORDER_DATE is from 2024-10-01 inclusive to 2025-01-01
      exclusive. Define merchandise gross profit as the sum of ORDER_ITEMS.LINE_TOTAL
      minus ORDER_ITEMS.QUANTITY multiplied by PRODUCTS.COST. Round to two decimals.
    intended_user: NovaMart merchandising lead
    decision: Establish Q4 merchandise gross profit for the electronics category.
    consequence_if_wrong: A bad join or order-level aggregation can materially inflate profit.
    truth_basis: computed
    data_scope:
      platform: snowflake
      database: BOOTCAMP_DB
      schema: NOVAMART
      tables: [ORDERS, ORDER_ITEMS, PRODUCTS]
    success_criteria:
      - type: numeric
        description: The item-grain merchandise gross profit matches an independent query.
    allowed_capabilities: [read_data, run_read_only_query]
    expected: 95431.16
    tolerance: {absolute: 0.01}
    graders:
      - id: q4-electronics-gross-profit
        type: numeric
        field: answer
        unit: currency
    slices: {domain: merchandising, complexity: high, risk: join_grain, data_shape: multi_table}
    data_snapshot: snowflake:novamart-commerce-2026-09-24-v1
    truth_evidence: Independently recomputed from the frozen Snowflake snapshot.
    reproduction: >-
      SELECT ROUND(SUM(oi.line_total-oi.quantity*p.cost),2)
      FROM BOOTCAMP_DB.NOVAMART.ORDERS o
      JOIN BOOTCAMP_DB.NOVAMART.ORDER_ITEMS oi ON o.order_id=oi.order_id
      JOIN BOOTCAMP_DB.NOVAMART.PRODUCTS p ON oi.product_id=p.product_id
      WHERE o.status='completed' AND o.order_date >= '2024-10-01'
      AND o.order_date < '2025-01-01' AND p.category='electronics';
    author: AI Analyst Lab

  - case_id: novamart-q4-completed-session-share-009
    case_version: "1"
    status: proposed
    exposure: working
    purpose: regression
    task: >-
      Using the configured NovaMart Snowflake data, return the percentage of distinct
      Q4 2024 sessions that are linked by SESSION_ID to at least one completed order
      in Q4 2024. Use SESSIONS with SESSION_DATE from 2024-10-01 inclusive to
      2025-01-01 exclusive. Do not use SESSIONS.HAD_PURCHASE. Divide distinct matched
      sessions by all distinct sessions, multiply by 100, and round to four decimals.
    intended_user: NovaMart product analytics lead
    decision: Estimate the observed completed-order session share without using the unreliable flag.
    consequence_if_wrong: Using HAD_PURCHASE or counting joined rows can misstate conversion.
    truth_basis: computed
    data_scope:
      platform: snowflake
      database: BOOTCAMP_DB
      schema: NOVAMART
      tables: [SESSIONS, ORDERS]
    success_criteria:
      - type: numeric
        description: The distinct-session percentage matches an independent query.
    allowed_capabilities: [read_data, run_read_only_query]
    expected: 2.5993
    tolerance: {absolute: 0.0001}
    graders:
      - id: q4-completed-session-share
        type: numeric
        field: answer
        unit: percent
    slices: {domain: product, complexity: high, risk: unreliable_field, data_shape: multi_table}
    data_snapshot: snowflake:novamart-commerce-2026-09-24-v1
    truth_evidence: Independently recomputed from distinct session identifiers in the frozen snapshot.
    reproduction: >-
      SELECT ROUND(100.0*COUNT(DISTINCT CASE WHEN o.order_id IS NOT NULL THEN s.session_id END)
      /NULLIF(COUNT(DISTINCT s.session_id),0),4)
      FROM BOOTCAMP_DB.NOVAMART.SESSIONS s
      LEFT JOIN BOOTCAMP_DB.NOVAMART.ORDERS o ON s.session_id=o.session_id
      AND o.status='completed' AND o.order_date >= '2024-10-01'
      AND o.order_date < '2025-01-01'
      WHERE s.session_date >= '2024-10-01' AND s.session_date < '2025-01-01';
    author: AI Analyst Lab

  - case_id: novamart-q4-plus-aov-difference-010
    case_version: "1"
    status: proposed
    exposure: working
    purpose: capability
    task: >-
      Using the configured NovaMart Snowflake data, calculate the difference in
      average TOTAL_AMOUNT between completed Plus-member orders and completed
      non-Plus orders for ORDER_DATE from 2024-10-01 inclusive to 2025-01-01
      exclusive. Return Plus average minus non-Plus average, rounded to two decimals.
    intended_user: NovaMart membership lead
    decision: Describe the observed Q4 order-value difference between Plus and non-Plus orders.
    consequence_if_wrong: Reversing the subtraction or mixing statuses changes the direction of the result.
    truth_basis: computed
    data_scope:
      platform: snowflake
      database: BOOTCAMP_DB
      schema: NOVAMART
      tables: [ORDERS]
    success_criteria:
      - type: numeric
        description: The signed difference in group averages matches an independent query.
    allowed_capabilities: [read_data, run_read_only_query]
    expected: -2.26
    tolerance: {absolute: 0.01}
    graders:
      - id: q4-plus-aov-difference
        type: numeric
        field: answer
        unit: currency
    slices: {domain: membership, complexity: medium, risk: directionality, data_shape: single_table}
    data_snapshot: snowflake:novamart-commerce-2026-09-24-v1
    truth_evidence: Independently recomputed from the frozen Snowflake snapshot.
    reproduction: >-
      WITH a AS (SELECT is_plus_member_order,AVG(total_amount) aov
      FROM BOOTCAMP_DB.NOVAMART.ORDERS WHERE status='completed'
      AND order_date >= '2024-10-01' AND order_date < '2025-01-01'
      GROUP BY is_plus_member_order)
      SELECT ROUND(MAX(IFF(is_plus_member_order,aov,NULL))
      -MAX(IFF(NOT is_plus_member_order,aov,NULL)),2) FROM a;
    author: AI Analyst Lab
