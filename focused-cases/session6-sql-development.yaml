  - case_id: novamart-q4-support-resolution-006
    case_version: "1"
    status: proposed
    exposure: working
    purpose: capability
    task: >-
      Using the configured NovaMart Snowflake data, return the median resolution
      time in hours for support tickets whose CREATED_DATE is from 2024-10-01
      inclusive to 2025-01-01 exclusive and whose RESOLVED_AT is not null. Compute
      elapsed minutes from CREATED_AT to RESOLVED_AT, divide by 60, and round to
      two decimals.
    intended_user: NovaMart support manager
    decision: Establish the typical resolution time for tickets created in Q4 2024.
    consequence_if_wrong: Including unresolved tickets or using a mean changes the operating signal.
    truth_basis: computed
    data_scope:
      platform: snowflake
      database: BOOTCAMP_DB
      schema: NOVAMART
      tables: [SUPPORT_TICKETS]
    success_criteria:
      - type: numeric
        description: The median resolved-ticket duration matches an independent query.
    allowed_capabilities: [read_data, run_read_only_query]
    expected: 24.22
    tolerance: {absolute: 0.01}
    graders:
      - id: q4-median-resolution-hours
        type: numeric
        field: answer
        unit: hours
    slices: {domain: support, complexity: medium, risk: missingness, data_shape: single_table}
    data_snapshot: snowflake:novamart-commerce-2026-09-24-v1
    truth_evidence: Independently recomputed from the frozen Snowflake snapshot.
    reproduction: >-
      SELECT ROUND(MEDIAN(DATEDIFF('minute',created_at,resolved_at))/60.0,2)
      FROM BOOTCAMP_DB.NOVAMART.SUPPORT_TICKETS
      WHERE created_date >= '2024-10-01' AND created_date < '2025-01-01'
      AND resolved_at IS NOT NULL;
    author: AI Analyst Lab

