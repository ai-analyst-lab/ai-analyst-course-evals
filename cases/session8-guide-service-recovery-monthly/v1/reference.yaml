policy: 'Service-recovery demand counts support tickets about payment, delivery or

  product-quality problems. It is a subset of support demand, not every ticket.


  Include tickets categorized as payment issues, delivery issues or product

  quality. Exclude account issues, membership issues and other categories.

  A missing or unrecognized category does not

  establish that the ticket belongs to service recovery; flag it if present.


  Count each ticket once, not distinct customers or orders. Tickets without a

  linked order still count when their category qualifies.


  A reporting period refers to tickets received in that period: use the stored

  ticket-created calendar date, with an inclusive start and exclusive end. Do not

  use the resolution date to determine when the ticket was received. Include open and

  resolved tickets; do not add severity, device or status restrictions unless

  the question asks for them.


  For a question about all support tickets or a particular literal category,

  use that requested population instead of imposing this service-recovery group.

  Ticket demand alone does not establish customer satisfaction or recovery success.

  '
