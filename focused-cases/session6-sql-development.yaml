suite_id: session6-sql-development
suite_version: "1"
data_snapshot: snowflake:novamart-commerce-2026-09-24-v1
purpose: Focused calculation checks that complement the complete-analysis cases
cases:
  - case_id: novamart-q4-completed-order-value-003
    case_version: "1"
    status: proposed
    exposure: working
    purpose: capability
    task: >-
      Using the configured NovaMart Snowflake data, return the sum of TOTAL_AMOUNT
      for orders whose STATUS is exactly completed and whose ORDER_DATE is from
      2024-10-01 inclusive to 2025-01-01 exclusive. Round to two decimals.
    intended_user: NovaMart general manager
    decision: Establish the completed-order value baseline for Q4 2024.
    consequence_if_wrong: A wrong population or date boundary distorts the operating baseline.
    truth_basis: computed
    data_scope:
      platform: snowflake
      database: BOOTCAMP_DB
      schema: NOVAMART
      tables: [ORDERS]
    success_criteria:
      - type: numeric
        description: The Q4 completed-order value matches an independently executed query.
    allowed_capabilities: [read_data, run_read_only_query]
    expected: 1275841.08
    tolerance: {absolute: 0.01}
    graders:
      - id: q4-completed-order-value
        type: numeric
        field: answer
        unit: currency
    slices: {domain: operations, complexity: low, risk: population, data_shape: single_table}
    data_snapshot: snowflake:novamart-commerce-2026-09-24-v1
    truth_evidence: Independently recomputed from the frozen Snowflake snapshot.
    reproduction: >-
      SELECT ROUND(SUM(total_amount),2) FROM BOOTCAMP_DB.NOVAMART.ORDERS
      WHERE status='completed' AND order_date >= '2024-10-01'
      AND order_date < '2025-01-01';
    author: AI Analyst Lab

