accepted_final_answer:
  required_conclusion:
    - Holiday Sale produced more total completed-order merchandise gross profit.
    - Black Friday produced more completed-order merchandise gross profit per promotion day.
    - The two rankings differ because the promotions ran for different numbers of days.
  required_recommendation:
    - Investigate incremental demand, cannibalization, customer mix, and costs not represented in merchandise cost before choosing which promotion to repeat.
  acceptable_semantic_variation: true
  prohibited_claims:
    - Black Friday or Holiday Sale caused the observed completed-order merchandise gross profit.
    - The descriptive comparison proves which promotion should be repeated.
    - Merchandise gross profit includes shipping, marketing spend, returns after completion, or every company cost.
    - Order-level total_amount can be summed after the item-level join without protecting the order grain.

